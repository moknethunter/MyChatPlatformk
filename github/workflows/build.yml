name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet workload install maui android
      - run: dotnet build MyChatPlatformk.Mobile/MyChatPlatformk.Mobile.csproj -f net8.0-android -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: MyChatPlatformk-APK
          path: MyChatPlatformk.Mobile/bin/Release/net8.0-android/**/*.apk
