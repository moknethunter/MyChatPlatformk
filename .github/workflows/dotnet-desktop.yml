name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: 
          dotnet-version: '8.0.x'
      
      - name: Install MAUI
        run: dotnet workload install maui android

      - name: Build Only Mobile Project
        run: dotnet build MyChatPlatformk.Mobile/MyChatPlatformk.Mobile.csproj -f net8.0-android -c Release --no-restore
        # مهم: ما نعمل dotnet test ابدا

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyChatPlatformk-APK
          path: MyChatPlatformk.Mobile/bin/Release/net8.0-android/**/*.apk
